<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage</title>
    <style>
        input[type='submit'],
        input[type='text'],
        input[type='password'] {
            background: gray;
            border: none;
            padding: 10px 20px;
            color: #fff;
        }

        ::placeholder {
            color: #fff;
            text-transform: capitalize;

        }

        #dataAppends {
            width: 80%;
            margin: 40px auto;
            display: flex;
            justify-content: start;
            align-items: center;
            flex-wrap: wrap;
            height: 100%;
            gap: 20px;
        }

        .card-div {
            border: 3px solid red;
            height: 100%;

        }
    </style>
</head>

<body onload="append()">
    <form onsubmit="formData(event)">
        <input placeholder="enter your name" type="text" name="userName" id="userName" autocomplete="email" />
        <input placeholder="enter your pass" type="password" name="userPass" id="userPass"
            autocomplete="current-password" />
        <input type="submit" value="click me" />
    </form>
    <div id="dataAppends"></div>
</body>
<script>
    let dataBase = JSON.parse(localStorage.getItem('sirajFormData')) || [];

    let setCurrentIndex = null;

    function formData(e) {
        e.preventDefault();

        let userName = document.querySelector('#userName').value.trim();
        // console.log('🚀 ~ userName:', userName);
        let userPass = document.querySelector('#userPass').value.trim();
        // console.log('🚀 ~ userPass:', userPass);

        if (!userName && !userPass) return;

        // create object 


        if (setCurrentIndex !== null) {
            dataBase[setCurrentIndex] = {
                ...dataBase[setCurrentIndex],
                name: userName,
                pass: userPass
            }
            setCurrentIndex = null;
        }
        else {
            let objData = {
                id: Date.now(),
                name: userName,
                pass: userPass
            };
            dataBase.push(objData);
        }

        // console.log('🚀 ~ objData:', objData);
        localStorage.setItem('sirajFormData', JSON.stringify(dataBase));
        append()
        document.querySelector('#userName').value = '';
        document.querySelector('#userPass').value = '';

    }


    const append = () => {
        const mainDiv = document.querySelector('#dataAppends');
        mainDiv.innerHTML = '';
        // dataBase map

        dataBase.map((element, index) => {
            const div = document.createElement('div');
            const id = document.createElement('h1');
            const userName = document.createElement('h3');
            const userPass = document.createElement('h3');
            const btn_1 = document.createElement('button');
            const btn_2 = document.createElement('button');

            // naam karan.

            div.classList.add('card-div');
            btn_1.innerText = 'edit';
            btn_2.textContent = 'delete';
            btn_1.className = 'edit-btn';
            btn_2.className = 'delete-btn';

            btn_1.addEventListener('click', () => {
                let user = dataBase[index];
                document.querySelector('#userName').value = user.name;
                document.querySelector('#userPass').value = user.pass;
                setCurrentIndex = index

            });

            btn_2.addEventListener('click', () => {
                let deleteData = dataBase.filter((el) => {
                    return el.id !== element.id;
                })
                dataBase = deleteData;
                localStorage.setItem('sirajFormData', JSON.stringify(dataBase));
                append();
            })



            // here we set the value line-wise.

            id.textContent = element.id;
            userName.textContent = element.name;
            userPass.textContent = element.pass;


            div.append(id, userName, userPass, btn_1, btn_2);
            mainDiv.append(div);


        })


    };


</script>

</html>
