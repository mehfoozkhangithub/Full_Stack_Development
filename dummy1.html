<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: xx-large;
            font-weight: bolder;
            text-align: center;
        }

        body {
            max-width: 100%;
            height: 98vh;
            border: 3px solid #000;
            margin: 10px;
            padding: 10px;
            display: flex;
            /* justify-content: center; */
            /* align-items: center; */
            flex-direction: column;
            gap: 10px;
        }

        header,
        nav,
        main,
        footer {
            background: #ff312d;
            height: 80px;
            border: 1px solid #000;
            width: 100%;
            height: 100%;
            line-height: 50px;
        }

        nav {
            background: #0cc1e0;
            height: 50px;
        }

        main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: transparent;
            gap: 20px;
            border: none;
        }

        .right,
        .left {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            /* width: 50%; */
            height: 350px;
        }

        .left>section {
            background-color: #febd59;
            width: 100%;
            height: 50%;
            border: 1px solid black;
        }

        .left>article {
            background-color: #ff914c;
            width: 100%;
            height: 50%;
            border: 1px solid black;
        }

        aside {
            height: 100%;
            width: 100%;
            background: #15ff00;
            border: 1px solid black;
        }

        footer {
            background: #737373;
        }


        @media (max-width:480px) {
            main {
                flex-direction: column;
            }

            aside {
                height: 300px;
            }

            footer {
                height: 400px;
            }

            body {
                height: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <p>
            &lt;header&gt;
        </p>
    </header>
    <nav>
        <p>
            &lt;nav&gt;
        </p>
    </nav>
    <main>
        <section class="left">
            <section> &lt;section&gt;</section>
            <article> &lt;article&gt;</article>
        </section>
        <section class="right">
            <aside>
                <p> &lt;aside&gt;</p>
            </aside>
        </section>
    </main>
    <footer>
        <p> &lt;footer&gt;</p>
    </footer>
</body>

</html>
