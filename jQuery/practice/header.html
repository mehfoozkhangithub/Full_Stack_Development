<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
    src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    

    <style>
        header{
            background-color: black;
            color: white;
            padding: 20px;
        }
        .icon{
            color: white;
            font-size: 30px;
            text-align: right;
            padding: 20px;
            cursor: pointer;
            display: none;
        }
        .fa {
            color: rgb(177, 38, 38);
        }

        li {
            display: inline-block;
            margin: 20px;
        }

        @media screen and (max-width : 700px) {
            ul {
                display: none;
                
            }
            ul li{
                display: block;
            }
            .icon{
            color: white;
            font-size: 30px;
            text-align: right;
            padding: 20px;
            cursor: pointer;
            display: block;
        }
        }
    </style>

</head>

<body>
    <header>
        <div class="icon">
            <i class="fa fa-cloud"></i>
        </div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Menu</li>
            <li>Contact</li>
        </ul>
    </header>

   
    <script>
        $(document).ready(function() {
            $('.icon').click(function(){
               $('ul').slideToggle()
            })
        })
    </script>
</body>

</html>
