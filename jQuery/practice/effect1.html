<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

</head>
<body>
    <h1>Hide, show and toggle</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi odio nostrum recusandae harum exercitationem doloremque fuga, optio quasi error perferendis culpa. Rerum aliquid blanditiis beatae voluptatibus, quia voluptas ab dolores.</p>
    <button id="hide">Hide</button>
    <button id="show">show</button>
 

    <script>
        $(document).ready(
            function() {
                $("#hide").click(function() {
                    $("p").hide()
                })

                $("#show").click(function() {
                    $("p").show()
                })

                $("#toggle").click(function() {
                    $("p").toggle()
                })
            })
    </script>
</body>
</html>
