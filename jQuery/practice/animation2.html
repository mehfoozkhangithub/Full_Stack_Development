<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>

      <script src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

      <style>
            .circle {
                  width: 20%;
                  height: 20%;
                  background-color: rgb(248, 79, 28);
                  border-radius: 50%;
                  position: absolute;
                  left: 40%;
                  top: 100%;
                  box-shadow: 10px 10px 50px rgb(120, 120, 2);
                  /* filter: blur(2px); */
            }

            .parent {
                  width: 500px;
                  height: 500px;
                  background-image: linear-gradient(to top, rgb(255, 47, 0), yellow);
                  position: relative;
                  overflow: hidden;
            }
      </style>
</head>

<body>
      <div class="parent">
            <div class="circle"></div>
      </div>
      <button id="start">sunsise</button>
      <button id="stop">sunset</button>

      <script>
            $(document).ready(function () {

                  $('#start').click(function () {
                        $('.circle').animate({
                              'position': ' absolute',
                              'left': '40%',
                              'top': '0%',

                        }, 5000);
                  })

                  $('#stop').click(function () {
                        $('.circle').animate({
                              'position': ' absolute',
                              'left': '40%',
                              'top': '100%',

                        }, 5000);
                  })
            })
      </script>

</body>

</html>
