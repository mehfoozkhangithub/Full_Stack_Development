<body>
    <iframe max-width="951" height="535" src="https://www.youtube.com/embed/PQnbtnsYUho" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

    <div style="text-decoration:none; overflow:hidden;width:100%;height:500px;">

        </div><a class="from-embedmap-code" href="https://www.bootstrapskins.com/themes" id="grab-map-data">premium
            bootstrap themes</a>
        <style>
            #embedded-map-display img {
                max-height: none;
                max-width: none !important;
                background: none !important;
            }
        </style>
    </div>

    <iframe width="100%" height="450" style="border:0" loading="lazy" allowfullscreen
        referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps/embed/v1/place?q=diva&key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8
