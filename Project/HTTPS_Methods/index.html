<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="shortcut icon" href="./utils/footer_Logo.svg" type="image/x-icon">
    <title>home page</title>

</head>

<body onload="myfunc()">
    <header class="header"></header>

    <div id="container"></div>

    <footer id="footers"></footer>
</body>
<script src="./javascript/index.js"></script>
<script type="module">

    import { Navbar, NavStyle, Footers, goHome, loginFunc, cartFunc } from './javascript/Navbar.js'

    document.querySelector('.header').innerHTML = Navbar();

    let styleTag = document.createElement("style");
    styleTag.textContent = NavStyle();
    document.head.append(styleTag);

    document.querySelector('#footers').innerHTML = Footers();

    document.querySelector('.homePage').addEventListener('click', () => {
        goHome();
    })
    document.querySelector('.loginFunc').addEventListener('click', () => {
        loginFunc();
    });
    document.querySelector('.cartFunc').addEventListener('click', () => {
        cartFunc();
    });

    // here we have to fetch the data and set the value on cart UI...



</script>

</html>
