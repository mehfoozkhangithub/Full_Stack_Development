    <style>
        body {

            display: flex;
            flex-direction: column-reverse;

        #body>.body-button {

            height: min(90vh, 780px);
            width: min(90vw, 100%);

            justify-content: center;

        .body-button {

            height: 100px;
            width: 200px;
            border: 3px solid red;
            border-image: linear-gradient(to right, #0066ff, #ff32d6) 1;

        .container {
            width: min(10000px, 100%);
            margin: 0 auto;
            columns: 3 300px;
            column-gap: 1em;
        }

        img {
            display: block;
            width: 100%;
            margin-bottom: 1em;
        }
    </style>
</head>
