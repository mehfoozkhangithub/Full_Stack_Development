<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <link rel="stylesheet" href="../Selector.css">
</head>

<body>
    <!-- combinator selector -->
    <!--! start child combinator -->
    <div class="combinator">
        <h1>hello</h1>
    </div>
    <!--! end child combinator -->

    <!-- start Descendant combinator -->
    <ul>
        <li>
            <div>Item 1</div>
            <ul>
                <li>Subitem A</li>
                <li>Subitem B</li>
            </ul>
        </li>
        <li>
            <div>Item 2</div>
            <ul>
                <li>Subitem A</li>
                <li>Subitem B</li>
            </ul>
        </li>
    </ul>
    <!-- end Descendant combinator -->
</body>

</html>
