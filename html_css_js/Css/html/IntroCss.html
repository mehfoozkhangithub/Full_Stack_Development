<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro of css</title>
    <link rel="stylesheet" href="../IntroCss.css">

    <style>
        /* elements */
        h1 {
            color: green;
        }

        /* class denoted by "." */
        /* id denoted by "#" */
        .h1-2 {
            color: aqua;
        }
    </style>
</head>

<body>
    <!-- ! inline css -->
    <!-- <h1 style="color: red;">hello world</h1> -->
    <!-- # internal css -->
    <h1>hello world</h1>
    <h1 class="h1-2">hello world</h1>
    <h1 id="h1-3">hello world</h1>
</body>

</html>
