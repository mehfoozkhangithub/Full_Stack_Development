    <fieldset>
        <legend>Country</legend>
        <select name="country">
            <option value="">Select country...</option>
            <option value="india">India</option>
            <option value="pakistan">Pakistan</option>
            <option value="china">China</option>
            <option value="russia">Russia</option>
        </select>
    </fieldset>
    <!-- 

#    You're using a <datalist> for autocomplete, but <option> inside <datalist> cannot be styled using CSS — it's a browser-native UI and doesn't expose much for customization. However, you can style the input element completely.
 
$ Some browsers use the OS UI for rendering <select>, so styling may be limited or inconsistent. You cannot style the hover or scrollbar of native dropdowns using just CSS.
