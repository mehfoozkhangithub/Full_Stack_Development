<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --black: #000;
            --text: #fff;
            --header: #ff3131;
            --nav: #0cc0df;
            --main: #e56699;
            --section: #febd59;
            --article: #FF6347;
            --aside: #8d6ae7;
            --footer: #737373
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            text-transform: capitalize;
            font-size: 23px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
        }


        body {
            border: 2px solid black;
            margin: 7px;
            padding: 7px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        header {
            background: var(--header);
            height: 15%;
            line-height: 50px;
            border: 1px solid var(--black);
        }

        nav {
            background: var(--nav);
            /* height: 5%; */
            line-height: 44px;
            border: 1px solid var(--black);
        }

        /* main,
        .child-1,
        .child-2 {
            border: 1px solid red;
        } */


        main {
            display: flex;
            gap: inherit;
            padding: 10px 0;
            height: 60%;
        }

        .child-1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .child-1,
        .child-2 {
            width: 50%;
        }

        .grand-child-1 {
            background: var(--section);
            height: 50%;
            line-height: 25vh;
            border: 1px solid var(--black)
        }

        .grand-child-2 {
            background: var(--article);
            height: 50%;
            line-height: 25vh;
            border: 1px solid var(--black)
        }

        .child-2 {
            background: var(--aside);
            border: 1px solid var(--black);
        }

        .child-2>aside {
            line-height: 60vh;
        }

        footer {
            background: var(--footer);
            border: 1px solid var(--black);
            height: 20%;
            line-height: 20vh;
        }


        /*  media query */

        /* for mobile */

        @media (max-width:430px) {

            body {
                height: 100%;
            }

            main {
                flex-direction: column;
            }

            .child-1,
            .child-2 {
                width: 100%;
            }

            .child-2>aside {
                line-height: 30vh;
            }

        }

        @media (min-width:500px) and (max-width:768px) {

            main {
                flex-direction: row-reverse;
            }

        }




        /* @media (min-width:1500px) {} */
    </style>
</head>

<body>

    <header>header</header>
    <nav>nav</nav>
    <main>
        <section class="child-1">
            <section class="grand-child-1">sections</section>
            <section class="grand-child-2">article</section>
        </section>
        <section class="child-2">
            <aside>aside</aside>
        </section>
    </main>
    <footer>footer</footer>

</body>

</html>
