<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image Lazy-Load</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            justify-items: center;
            align-items: center;
            gap: 10px;
        }

        img {
            width: 100%;
            aspect-ratio: 1/1;
        }
    </style>
</head>

<body>
    <div class="container"></div>
</body>
<script src="./index.js"></script>

</html>
