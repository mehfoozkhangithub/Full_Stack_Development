<!DOCTYPE html>
<html>

<head>
    <title>Iframe Content</title>
    <link rel="shortcut icon" href="../../utils/react-logo-svgrepo-com.svg" type="image/x-icon">
</head>

<body>
    <h3>Inside Iframe</h3>

    <p>
        <a href="../../utils/facebook-messenger-logo-svgrepo-com.svg" target="_parent">
            Open image with target="_parent"
        </a>
    </p>

    <p>
        <a href="../../utils/facebook-messenger-logo-svgrepo-com.svg" target="_top">
            Open image with target="_top"
        </a>
    </p>

    <p>
        <a href="../../utils/facebook-messenger-logo-svgrepo-com.svg" target="_self">
            Open image with target="_self" (inside iframe)
        </a>
    </p>
    <p>
        <a href="../../utils/facebook-messenger-logo-svgrepo-com.svg" target="_blank">
            Open image with target="_blank" (new tab)
        </a>
    </p>
</body>

</html>
