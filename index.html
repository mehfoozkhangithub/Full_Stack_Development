<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex and grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 52px;
      text-align: center;
      line-height: 180px;
    }

    body {
      border: 3px solid red;
      height: 150vh;
    }

    .container {
      border: 3px solid green;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      flex-direction: row-reverse;
      gap: 10px;
      width: 100%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .box {
      width: 180px;
      height: 180px;
      background: blue;
    }

    .container_grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid gray;
      justify-items: center;
      align-items: center;
      height: inherit;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
  </div>

</html>
