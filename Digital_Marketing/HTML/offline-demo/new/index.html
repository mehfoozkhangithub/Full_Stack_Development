<!DOCTYPE html>
<html>

<head>
    <title>Offline Web App with Service Worker</title>
</head>

<body>
    <h1>My Offline App</h1>
    <p>Turn off your internet and refresh – it will still load!</p>
    <img src="neu_pass.png" alt="Offline Image" width="200" />
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("Service Worker Registered"));
        }
    </script>
</body>

</html>
