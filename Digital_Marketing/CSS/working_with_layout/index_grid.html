<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grid Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }

        header {
            grid-area: header;
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            grid-area: sidebar;
            background: #f4f4f4;
            padding: 20px;
        }

        main {
            grid-area: main;
            background: #fafafa;
            padding: 20px;
        }

        footer {
            grid-area: footer;
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>Header</header>
    <nav>Sidebar</nav>
    <main>Main Content</main>
    <footer>Footer</footer>
</body>

</html>
