<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            background: rgba(247, 55, 87, 0.822);
            border: 2px solid tomato;
            height: 200px;
            text-align: center;
            font-size: 44px;
            color: #fff;
            line-height: 200px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-areas: "child-1 child-1 child-4"
                "child-3 child-3 child-3"
                "child-6 child-7 ."
            ;
            gap: 10px;
            margin: 10px;
        }

        .child-1 {
            grid-area: child-1;
        }

        .child-2 {
            grid-area: child-2;
        }

        .child-3 {
            grid-area: child-3;
        }

        .child-4 {
            grid-area: child-4;
        }

        .child-5 {
            grid-area: child-5;
        }

        .child-6 {
            grid-area: child-6;
        }

        .child-7 {
            grid-area: child-7;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box child-1">1</div>
        <div class="box child-2">2</div>
        <div class="box child-3">3</div>
        <div class="box child-4">4</div>
        <div class="box child-5">5</div>
        <div class="box child-6">6</div>
        <div class="box child-7">7</div>
    </div>
</body>

</html>
