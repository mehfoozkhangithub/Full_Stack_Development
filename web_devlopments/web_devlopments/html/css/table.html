<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .table {
            border: 3px outset gray;
            padding: 1px;
        }

        .th,
        .td {
            border: 1px inset gray;
            padding: 2px;
        }
    </style>
</head>

<body>
    <h1>with-out css</h1>

    <table border="3">
        <tr>
            <th>sr no</th>
            <th>name</th>
            <th>age</th>
        </tr>
        <tr>
            <td>1</td>
            <td>mehfooz</td>
            <td>99</td>
        </tr>
        <tr>
            <td>2</td>
            <td>shivam</td>
            <td>104</td>
        </tr>
        <tr>
            <td>3</td>
            <td>suraj</td>
            <td>inifinty</td>
        </tr>
        <tr>
            <td>4</td>
            <td>sneha</td>
            <td>2000</td>
        </tr>
    </table>

    <hr>

    <h1>with css</h1>
    <table class="table">
        <tr class="tr">
            <th class="th">sr no</th>
            <th class="th">name</th>
            <th class="th">age</th>
        </tr>
        <tr class="tr">
            <td class="td">1</td>
            <td class="td">mehfooz</td>
            <td class="td">99</td>
        </tr>
        <tr class="tr">
            <td class="td">2</td>
            <td class="td">shivam</td>
            <td class="td">104</td>
        </tr>
        <tr class="tr">
            <td class="td">3</td>
            <td class="td">suraj</td>
            <td class="td">inifinty</td>
        </tr>
        <tr class="tr">
            <td class="td">4</td>
            <td class="td">sneha</td>
            <td class="td">2000</td>
        </tr>
    </table>

</body>

</html>
