<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-transform: capitalize;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        header {
            height: 3.5rem;
            background: red;
            padding: 1.3rem 0;
            margin-bottom: 0.5em;
        }

        nav {
            height: 2.5rem;
            background: aqua;
            padding: 0.6rem 0;

        }

        main {
            height: 32.5rem;
            display: flex;
        }

        footer {
            height: 10rem;
            background: gray;
            padding: 5rem 0;
        }

        .first_child,
        .second_child {
            width: 50%;
            margin: 1em;
        }

        .second_child {
            background: violet;
            padding: 15rem 0;
        }

        .first_child {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .first_child>section,
        .first_child>article {
            height: 50%;
            background: paleturquoise;
            padding: 6rem 0;
        }

        .first_child>article {
            background: burlywood;
        }


        /* 
        
        max min

        max -300px

        min- 350px


        */




        @media (max-width:450px) {
            main {
                flex-direction: column;
                height: auto;
            }

            .first_child,
            .second_child {
                width: 100%;
                margin: 1em auto;
            }
        }
    </style>
</head>

<body>
    <header> header </header>
    <nav>navbar</nav>
    <main>
        <div class="first_child">
            <section>section</section>
            <article>articles</article>
        </div>
        <div class="second_child">
            <aside>aside</aside>
        </div>
    </main>
    <footer>footer</footer>
</body>

</html>
