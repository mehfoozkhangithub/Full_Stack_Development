<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i frame tag's</title>
</head>

<body>
    <h1>youtube</h1>
    <iframe width="100%" height="760px" src="https://www.youtube.com/embed/FsB_nRGdeLs" frameborder="0"
        allowfullscreen></iframe>

    <h2>google map embed code</h2>

    <div class="embed-map-responsive">
        <div class="embed-map-container">
            <iframe class="embed-map-frame" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
                src="https://maps.google.com/maps?hl=en&q=america&t=&z=20&ie=UTF8&iwloc=B&output=embed"></iframe>
            <a href="https://sprunkiretake.net"
                style="font-size:2px!important;color:gray!important;position:absolute;bottom:0;left:0;z-index:1;max-height:1px;overflow:hidden">sprunki
                retake</a>
        </div>
        <style>
            .embed-map-responsive {
                position: relative;
                text-align: right;
                width: 100%;
                height: 0;
                padding-bottom: 66.66666666666666%;
            }

            .embed-map-container {
                overflow: hidden;
                background: none !important;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
            }

            .embed-map-frame {
                width: 100% !important;
                height: 100% !important;
                position: absolute;
                top: 0;
                left: 0;
            }
        </style>
    </div>

    <h4>youtube news</h4>
    <iframe width="951" height="535" src="https://www.youtube.com/embed/1g280_DNQ8Y" frameborder="0"
        allowfullscreen></iframe>

    <var>x+y=2</var>

    <marquee bgcolor="yellow" loop behavior="alternate" direction="up">
        <h1>hello world</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi, architecto!</p>
    </marquee>


    <video src="../html_css_js/utils/video_water_fall.mp4" controls autoplay loop></video>


    <audio src="../html_css_js/utils/melody-of-nature-main.mp3" controls autoplay loop></audio>

    <figure style="border: 1px solid gray;">
        <img src="../html_css_js/utils/car-1068794_1280.webp" alt="">
        <figcaption>fig 1.1 Lorem ipsum dolor sit amet consectetur adipisicing elit. Odit nisi doloremque quisquam,
            autem saepe doloribus aperiam laborum suscipit repellendus perspiciatis?</figcaption>
    </figure>

</body>

</html>
