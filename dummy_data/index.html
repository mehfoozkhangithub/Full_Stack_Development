<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>local storage</title>
</head>

<body>

  <h1>hello mehfooz khan how are you???</h1>
  <input type="text" id="name">
  <button id="btn" onclick="LS_insert()">add to Ls</button>


  <div class="LS"></div>

</body>
<script>

  // ls


  let heading_1 = document.getElementsByTagName("h1")[0].innerText;
  let btn = document.getElementById("btn");
  let div_LS = document.getElementsByTagName("div")[0];


  function LS_insert() {
    let input = document.getElementById("name").value;
    console.log('🚀 ~ input:', input);
    localStorage.setItem("name", heading_1);
    render_UI();
  }
  // btn.addEventListener("click", function () {
  //   localStorage.setItem("name", heading_1)
  // render_UI();
  // });

  function render_UI() {
    let LS_Value = localStorage.getItem("name") || "";

    div_LS.innerHTML = `
    <p>${LS_Value}</p>
    `
  }
</script>

</html>
